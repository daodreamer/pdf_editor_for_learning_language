name: Phase 0 probes
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .tools/venv
          .tools/venv/Scripts/python -m pip install -r tools/requirements-phase0.lock.txt
          .tools/venv/Scripts/python tools/bootstrap.py --platform windows
          .tools/venv/Scripts/python tools/bootstrap-dictionary.py
          ./tools/build-windows.ps1 -Test -Phase0
          .tools/venv/Scripts/python tools/make-fixtures.py
          $env:PATH = "$pwd/.deps/Qt/6.8.3/msvc2022_64/bin;" + $env:PATH
          .tools/venv/Scripts/python tests/integration.py --exe build/windows/phase0_pdf_probe.exe --font .deps/fonts/NotoSansSC-Regular.ttf --out benchmarks/results/ci-windows
  macos-arm64:
    # Prepared only: requires an actual registered Apple Silicon runner.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - shell: bash
        run: |
          set -eu
          test "$(uname -m)" = arm64
          python -m venv .tools/venv
          .tools/venv/bin/python -m pip install aqtinstall==3.3.0 cmake==3.31.6 ninja==1.11.1.3 fonttools==4.60.1 PyMuPDF==1.26.5
          .tools/venv/bin/python tools/bootstrap.py --platform mac
          .tools/venv/bin/python tools/bootstrap-dictionary.py
          export PATH="$PWD/.tools/venv/bin:$PATH"
          .deps/Qt/6.8.3/macos/bin/qt-cmake -S . -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DLANGLERN_BUILD_PHASE0=ON -DPDFium_DIR="$PWD/.deps/pdfium-mac"
          cmake --build build/macos --parallel 4
          ctest --test-dir build/macos --output-on-failure
          .tools/venv/bin/python tools/make-fixtures.py
          .tools/venv/bin/python tests/integration.py --exe build/macos/prototypes/phase0/phase0_pdf_probe --font .deps/fonts/NotoSansSC-Regular.ttf --out benchmarks/results/ci-macos
