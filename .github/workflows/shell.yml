name: Desktop PDF reader (Windows)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .tools/venv
          .tools/venv/Scripts/python -m pip install -r tools/requirements-phase0.lock.txt
          .tools/venv/Scripts/python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O .deps/Qt --archives qtbase qtdeclarative qttools
          .tools/venv/Scripts/python tools/bootstrap.py --platform windows --pdfium-only
          .tools/venv/Scripts/python tools/bootstrap-dictionary.py
          # The full French database is ~593 MB upstream; CI tests lookup against real sample lines instead.
          .tools/venv/Scripts/python tools/bootstrap-french-dictionary.py --source tests/fixtures/fr-wiktionary-sample.jsonl --output-dir build/fr-sample
          $env:LANGLERN_FR_DICTIONARY = "$PWD/build/fr-sample/fr-wiktionary.sqlite"
          ./tools/build-windows.ps1 -BuildDir build/windows -Test -Lint
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(LinguaPDF VERSION (\S+)').Matches[0].Groups[1].Value
          $package = "build/packages/LinguaPDF-$version-windows-x64"
          "PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          ./tools/package-windows.ps1 -BuildDir build/windows -OutputDir $package
          .tools/venv/Scripts/python -X utf8 tools/validate-windows-package.py --package $package --out benchmarks/results/ci-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-test-results
          path: |
            build/windows/Testing/Temporary/
            build/windows/tests/shell/*.txt
            benchmarks/results/ci-package/*.log
            benchmarks/results/ci-package/summary.json
      - uses: actions/upload-artifact@v4
        with:
          # CI uses a sample French dictionary; the published release is packaged locally (docs/RELEASING.md).
          name: linguapdf-windows-x64-ci
          path: |
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}.sha256
  # macOS execution is deferred by the user until the complete project is ready.
